<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Todo list-online</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>

<header>
    <nav>
    </nav>
</header>
<body>

    <section class="main-todo">
        <div class="main-contents">
            
            <div class="main-title">
                <img id="title" src="src/images/todo.svg" alt="todo-img">
            </div>

            <div class="main-task">

                <input id="addTask" type="text" placeholder="Add a To-Do item...">
                <button id="addTaskBtn">Add</button>
            </div>

            <div>
                <p id="warningMsg"></p>
            </div>
        

            <div class="tasks">
                <div>
                    <ul id="tasks">
                    </ul>
                </div>

                <div class="welcome">

                    <p>Add Your First To-Do Item! 📝</p>
                    <p>Usage Tips 💡:</p>
                    <p>✔️ Click 'Add' to submit actions.</p>
                    <p>✔️ Drag to reorder your to-dos (comming soon)</p>
                    <p>✔️ Double-click to edit slogan and tasks.(PC only)</p>
                    <p>🔒 Your data is stored locally in your browser.</p>
                    <p>📝 Data download and import (comming soon)</p>

                </div>


            </div>
        </div>
        

    </section>


    <script src="src/script/script.js"></script>
</body>
</htm
